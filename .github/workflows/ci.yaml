name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-xschem-rocky8:
    name: xschem + ROOM (Rocky Linux 8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: rockylinux:8

    steps:
      - name: Checkout XSchem-roomdb
        uses: actions/checkout@v4
        with:
          path: XSchem-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: bash XSchem-roomdb/scripts/ci-rocky8-deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-rocky8-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-rocky8-v1-

      - name: Bootstrap Cap'n Proto
        run: |
          COMMONDB_ROOT="$GITHUB_WORKSPACE/CommonDB"
          sed -i 's/\r$//' "$COMMONDB_ROOT/scripts/build_capnp_linux.sh"
          CAPNP_SKIP_CHECK=1 bash "$COMMONDB_ROOT/scripts/build_capnp_linux.sh" \
            "https://github.com/capnproto/capnproto.git" branch master "" "" \
            "$COMMONDB_ROOT/third_party/capnproto-linux" \
            "$COMMONDB_ROOT/third_party/capnp-install-linux"

      - name: Build and install xschem
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export INSTALL_PREFIX="$XSCHEM_ROOT/dist-install"
          sed -i 's/\r$//' "$XSCHEM_ROOT/scripts/build-xschem-ci.sh"
          bash "$XSCHEM_ROOT/scripts/build-xschem-ci.sh"

      - name: Build roomtcl.so
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export COMMONDB_ROOT="$GITHUB_WORKSPACE/CommonDB"
          sed -i 's/\r$//' "$XSCHEM_ROOT/build-room-tcl.sh" "$COMMONDB_ROOT/scripts/build_capnp_linux.sh"
          bash "$XSCHEM_ROOT/build-room-tcl.sh"
          test -f "$XSCHEM_ROOT/integrations/roomtcl.so"

      - name: Verify binaries
        run: |
          PREFIX="$GITHUB_WORKSPACE/XSchem-roomdb/dist-install"
          test -x "$PREFIX/bin/xschem"
          test -f "$GITHUB_WORKSPACE/XSchem-roomdb/integrations/roomtcl.so"

      - name: Package portable bundle
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export CAPNP_ROOT="$GITHUB_WORKSPACE/CommonDB/third_party/capnp-install-linux"
          sed -i 's/\r$//' \
            "$XSCHEM_ROOT/scripts/package_xschem_linux_bundle.sh" \
            "$XSCHEM_ROOT/scripts/bundle_native_libs.sh"
          bash "$XSCHEM_ROOT/scripts/package_xschem_linux_bundle.sh" \
            "$XSCHEM_ROOT/dist-install" \
            "$XSCHEM_ROOT/xschem-rocky8-bundle.tar.gz" \
            "Rocky Linux 8"

      - name: Upload xschem bundle
        uses: actions/upload-artifact@v4
        with:
          name: xschem-rocky8
          path: XSchem-roomdb/xschem-rocky8-bundle.tar.gz

  build-ubuntu24:
    name: build-ubuntu24
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout XSchem-roomdb
        uses: actions/checkout@v4
        with:
          path: XSchem-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Verify CommonDB checkout
        run: test -f CommonDB/src/room_paths.h

      - name: Install dependencies
        run: bash XSchem-roomdb/scripts/ci-ubuntu24-deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-ubuntu24-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-ubuntu24-v1-

      - name: Bootstrap Cap'n Proto
        run: |
          COMMONDB_ROOT="$GITHUB_WORKSPACE/CommonDB"
          sed -i 's/\r$//' "$COMMONDB_ROOT/scripts/build_capnp_linux.sh"
          CAPNP_SKIP_CHECK=1 bash "$COMMONDB_ROOT/scripts/build_capnp_linux.sh" \
            "https://github.com/capnproto/capnproto.git" branch master "" "" \
            "$COMMONDB_ROOT/third_party/capnproto-linux" \
            "$COMMONDB_ROOT/third_party/capnp-install-linux"

      - name: Build and install xschem
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export INSTALL_PREFIX="$XSCHEM_ROOT/dist-install"
          sed -i 's/\r$//' "$XSCHEM_ROOT/scripts/build-xschem-ci.sh"
          bash "$XSCHEM_ROOT/scripts/build-xschem-ci.sh"

      - name: Build roomtcl.so
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export COMMONDB_ROOT="$GITHUB_WORKSPACE/CommonDB"
          sed -i 's/\r$//' "$XSCHEM_ROOT/build-room-tcl.sh" "$COMMONDB_ROOT/scripts/build_capnp_linux.sh"
          bash "$XSCHEM_ROOT/build-room-tcl.sh"
          test -f "$XSCHEM_ROOT/integrations/roomtcl.so"

      - name: Verify binaries
        run: |
          PREFIX="$GITHUB_WORKSPACE/XSchem-roomdb/dist-install"
          test -x "$PREFIX/bin/xschem"
          test -f "$GITHUB_WORKSPACE/XSchem-roomdb/integrations/roomtcl.so"

      - name: Package portable bundle
        run: |
          export XSCHEM_ROOT="$GITHUB_WORKSPACE/XSchem-roomdb"
          export CAPNP_ROOT="$GITHUB_WORKSPACE/CommonDB/third_party/capnp-install-linux"
          sed -i 's/\r$//' \
            "$XSCHEM_ROOT/scripts/package_xschem_linux_bundle.sh" \
            "$XSCHEM_ROOT/scripts/bundle_native_libs.sh"
          bash "$XSCHEM_ROOT/scripts/package_xschem_linux_bundle.sh" \
            "$XSCHEM_ROOT/dist-install" \
            "$XSCHEM_ROOT/xschem-ubuntu24-bundle.tar.gz" \
            "Ubuntu 24.04"

      - name: Smoke-test bundled binary (headless)
        run: |
          set -euxo pipefail
          tar -xzf XSchem-roomdb/xschem-ubuntu24-bundle.tar.gz -C XSchem-roomdb
          test -x XSchem-roomdb/dist-bundle/xschem-run.sh
          if ! timeout 8s xvfb-run -a XSchem-roomdb/dist-bundle/xschem-run.sh; then
            status=$?
            if [[ "${status}" -ne 124 ]]; then
              echo "Smoke test failed with exit ${status}" >&2
              exit "${status}"
            fi
          fi

      - name: Upload xschem bundle
        uses: actions/upload-artifact@v4
        with:
          name: xschem-ubuntu24
          path: XSchem-roomdb/xschem-ubuntu24-bundle.tar.gz
          retention-days: 14
